<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario de Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14181F; }
  input:focus, select:focus, textarea:focus { border-color: #F5A623 !important; }
  button:focus-visible { outline: 2px solid #F5A623; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2A3242; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------- Iconos SVG minimalistas ---------- */
const Icon = ({ d, size = 14, ...props }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
    <path d={d} />
  </svg>
);
const IconPlus = (p) => <Icon d="M12 5v14M5 12h14" {...p} />;
const IconSearch = (p) => <Icon d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35" {...p} />;
const IconPencil = (p) => <Icon d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z" {...p} />;
const IconTrash = (p) => <Icon d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" {...p} />;
const IconX = (p) => <Icon d="M18 6L6 18M6 6l12 12" {...p} />;
const IconCpu = (p) => <Icon d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2M6 6h12v12H6z" {...p} />;
const IconRam = (p) => <Icon d="M6 19V5a2 2 0 012-2h8a2 2 0 012 2v14M2 19h20M6 19v2M10 19v2M14 19v2M18 19v2" {...p} />;
const IconDisk = (p) => <Icon d="M2 12h20M6 8h.01M12 16v0M2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-2-8H4l-2 8z" {...p} />;
const IconKeyboard = (p) => <Icon d="M2 6h20v12H2z M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12" {...p} />;
const IconMouse = (p) => <Icon d="M12 2a7 7 0 00-7 7v6a7 7 0 0014 0V9a7 7 0 00-7-7zM12 2v7" {...p} />;
const IconMapPin = (p) => <Icon d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z M12 10a3 3 0 100-6 3 3 0 000 6z" {...p} />;
const IconChevronDown = (p) => <Icon d="M6 9l6 6 6-6" {...p} />;

const STATUS = {
  operativo: { label: "OPERATIVO", color: "#4FD1C5", bg: "rgba(79,209,197,0.12)" },
  reparacion: { label: "EN REPARACIÓN", color: "#F5A623", bg: "rgba(245,166,35,0.12)" },
  baja: { label: "DE BAJA", color: "#8B93A7", bg: "rgba(139,147,167,0.12)" },
};

const emptyForm = {
  codigo: "", ubicacion: "", modelo: "", procesador: "", ram: "",
  almacenamientoTipo: "SSD", almacenamientoCapacidad: "",
  tecladoTipo: "", tecladoConexion: "Alámbrico",
  mouseTipo: "", mouseConexion: "Alámbrico",
  estado: "operativo", notas: "",
};

const btnGhost = {
  display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600,
  background: "transparent", border: "1px solid #2A3242", color: "#C9CDD8",
  padding: "7px 12px", borderRadius: 6, cursor: "pointer", flex: 1, justifyContent: "center",
};
const btnGhostDanger = { ...btnGhost, color: "#E88" };
const inputStyle = {
  width: "100%", background: "#151A24", border: "1px solid #2A3242", borderRadius: 6,
  color: "#E8E6E1", padding: "9px 11px", fontSize: 13.5, fontFamily: "'Inter', sans-serif",
  outline: "none", boxSizing: "border-box",
};
const selectStyle = { ...inputStyle, appearance: "none", cursor: "pointer" };

function Spec({ icon, label, value }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 5, color: "#5B6478", fontSize: 10.5, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 2 }}>
        {icon} {label}
      </div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#E8E6E1" }}>
        {value || "—"}
      </div>
    </div>
  );
}

function Periph({ icon, tipo, conexion, label }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#C9CDD8" }}>
      <span style={{ color: "#5B6478" }}>{icon}</span>
      <span style={{ color: "#5B6478" }}>{label}:</span>
      <span>{tipo || "—"}{conexion ? ` · ${conexion}` : ""}</span>
    </div>
  );
}

function AssetTag({ pc, onEdit, onDelete }) {
  const s = STATUS[pc.estado] || STATUS.operativo;
  return (
    <div style={{ background: "#1C2230", border: "1px solid #2A3242", borderRadius: 10, position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", top: 0, left: 0, bottom: 0, width: 10,
        backgroundImage: "repeating-linear-gradient(180deg, #3A4356 0px, #3A4356 2px, transparent 2px, transparent 5px)" }} />
      <div style={{ padding: "18px 18px 18px 26px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
          <div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#6B7280", letterSpacing: 1 }}>ACTIVO N.º</div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#E8E6E1" }}>
              {pc.codigo || "SIN CÓDIGO"}
            </div>
          </div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, fontWeight: 700,
            color: s.color, background: s.bg, border: `1px solid ${s.color}55`,
            padding: "4px 9px", borderRadius: 4, letterSpacing: 0.6, transform: "rotate(-2deg)", whiteSpace: "nowrap" }}>
            {s.label}
          </div>
        </div>

        {pc.ubicacion && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#8B93A7", fontSize: 12.5, marginBottom: 12 }}>
            <IconMapPin size={13} /> {pc.ubicacion}
          </div>
        )}

        <div style={{ color: "#C9CDD8", fontSize: 14, fontWeight: 600, marginBottom: 12 }}>
          {pc.modelo || "Modelo sin especificar"}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "9px 14px", marginBottom: 14 }}>
          <Spec icon={<IconCpu size={14} />} label="Procesador" value={pc.procesador} />
          <Spec icon={<IconRam size={14} />} label="RAM" value={pc.ram} />
          <Spec icon={<IconDisk size={14} />} label="Almacenamiento" value={`${pc.almacenamientoTipo} ${pc.almacenamientoCapacidad || ""}`.trim()} />
        </div>

        <div style={{ display: "flex", gap: 14, paddingTop: 12, borderTop: "1px dashed #2A3242" }}>
          <Periph icon={<IconKeyboard size={14} />} tipo={pc.tecladoTipo} conexion={pc.tecladoConexion} label="Teclado" />
          <Periph icon={<IconMouse size={14} />} tipo={pc.mouseTipo} conexion={pc.mouseConexion} label="Mouse" />
        </div>

        {pc.notas && <div style={{ marginTop: 12, fontSize: 12.5, color: "#8B93A7", fontStyle: "italic" }}>{pc.notas}</div>}

        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button onClick={() => onEdit(pc)} style={btnGhost}><IconPencil size={13} /> Editar</button>
          <button onClick={() => onDelete(pc.id)} style={btnGhostDanger}><IconTrash size={13} /> Eliminar</button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <div style={{ fontSize: 11.5, fontWeight: 600, color: "#8B93A7", letterSpacing: 0.4, textTransform: "uppercase", marginBottom: 6 }}>
        {label}
      </div>
      {children}
    </label>
  );
}

function Modal({ initial, onSave, onClose }) {
  const [form, setForm] = useState(initial);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10,13,20,0.72)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }} onClick={onClose}>
      <div style={{ background: "#1C2230", border: "1px solid #2A3242", borderRadius: 12,
          width: "100%", maxWidth: 560, maxHeight: "88vh", overflowY: "auto", padding: 26 }}
        onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, color: "#E8E6E1", margin: 0 }}>
            {initial.id ? "Editar equipo" : "Nuevo equipo"}
          </h2>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#8B93A7", cursor: "pointer" }}>
            <IconX size={20} />
          </button>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
          <Field label="Código / ID"><input style={inputStyle} value={form.codigo} onChange={set("codigo")} placeholder="PC-01" /></Field>
          <Field label="Ubicación"><input style={inputStyle} value={form.ubicacion} onChange={set("ubicacion")} placeholder="Sala de sistemas" /></Field>
        </div>

        <Field label="Modelo"><input style={inputStyle} value={form.modelo} onChange={set("modelo")} placeholder="Ej: HP ProDesk 400 G5" /></Field>
        <Field label="Procesador"><input style={inputStyle} value={form.procesador} onChange={set("procesador")} placeholder="Ej: Intel Core i5-8500" /></Field>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "0 14px" }}>
          <Field label="RAM"><input style={inputStyle} value={form.ram} onChange={set("ram")} placeholder="8 GB" /></Field>
          <Field label="Tipo disco">
            <div style={{ position: "relative" }}>
              <select style={selectStyle} value={form.almacenamientoTipo} onChange={set("almacenamientoTipo")}>
                <option>SSD</option><option>HDD</option><option>SSD + HDD</option>
              </select>
              <IconChevronDown size={14} style={{ position: "absolute", right: 10, top: 11, color: "#8B93A7", pointerEvents: "none" }} />
            </div>
          </Field>
          <Field label="Capacidad"><input style={inputStyle} value={form.almacenamientoCapacidad} onChange={set("almacenamientoCapacidad")} placeholder="256 GB" /></Field>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
          <Field label="Tipo de teclado"><input style={inputStyle} value={form.tecladoTipo} onChange={set("tecladoTipo")} placeholder="Membrana" /></Field>
          <Field label="Conexión teclado">
            <div style={{ position: "relative" }}>
              <select style={selectStyle} value={form.tecladoConexion} onChange={set("tecladoConexion")}>
                <option>Alámbrico</option><option>Inalámbrico</option>
              </select>
              <IconChevronDown size={14} style={{ position: "absolute", right: 10, top: 11, color: "#8B93A7", pointerEvents: "none" }} />
            </div>
          </Field>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
          <Field label="Tipo de mouse"><input style={inputStyle} value={form.mouseTipo} onChange={set("mouseTipo")} placeholder="Óptico" /></Field>
          <Field label="Conexión mouse">
            <div style={{ position: "relative" }}>
              <select style={selectStyle} value={form.mouseConexion} onChange={set("mouseConexion")}>
                <option>Alámbrico</option><option>Inalámbrico</option>
              </select>
              <IconChevronDown size={14} style={{ position: "absolute", right: 10, top: 11, color: "#8B93A7", pointerEvents: "none" }} />
            </div>
          </Field>
        </div>

        <Field label="Estado">
          <div style={{ position: "relative" }}>
            <select style={selectStyle} value={form.estado} onChange={set("estado")}>
              <option value="operativo">Operativo</option>
              <option value="reparacion">En reparación</option>
              <option value="baja">De baja</option>
            </select>
            <IconChevronDown size={14} style={{ position: "absolute", right: 10, top: 11, color: "#8B93A7", pointerEvents: "none" }} />
          </div>
        </Field>

        <Field label="Notas">
          <textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical", fontFamily: "'Inter', sans-serif" }} value={form.notas} onChange={set("notas")} placeholder="Observaciones del mantenimiento..." />
        </Field>

        <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
          <button onClick={onClose} style={{ ...btnGhost, flex: 1 }}>Cancelar</button>
          <button onClick={() => onSave(form)} style={{ flex: 2, background: "#F5A623", border: "none", color: "#151A24",
            fontWeight: 700, fontSize: 13.5, borderRadius: 6, padding: "10px 14px", cursor: "pointer" }}>
            Guardar equipo
          </button>
        </div>
      </div>
    </div>
  );
}

const STORAGE_KEY = "inventario_equipos_v1";

function Inventario() {
  const [equipos, setEquipos] = useState([]);
  const [modal, setModal] = useState(null);
  const [query, setQuery] = useState("");
  const [filtro, setFiltro] = useState("todos");

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setEquipos(JSON.parse(raw));
    } catch (e) { console.error("No se pudo leer el inventario guardado", e); }
  }, []);

  const persist = (next) => {
    setEquipos(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }
    catch (e) { console.error("No se pudo guardar", e); }
  };

  const handleSave = (form) => {
    if (form.id) persist(equipos.map((e) => (e.id === form.id ? form : e)));
    else persist([{ ...form, id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) }, ...equipos]);
    setModal(null);
  };

  const handleDelete = (id) => {
    if (window.confirm("¿Eliminar este equipo del inventario?")) {
      persist(equipos.filter((e) => e.id !== id));
    }
  };

  const filtered = useMemo(() => equipos.filter((e) => {
    if (filtro !== "todos" && e.estado !== filtro) return false;
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return [e.codigo, e.ubicacion, e.modelo, e.procesador].some((v) => (v || "").toLowerCase().includes(q));
  }), [equipos, query, filtro]);

  const counts = useMemo(() => {
    const c = { operativo: 0, reparacion: 0, baja: 0 };
    equipos.forEach((e) => { if (c[e.estado] !== undefined) c[e.estado]++; });
    return c;
  }, [equipos]);

  return (
    <div style={{ minHeight: "100vh", background: "#14181F", fontFamily: "'Inter', sans-serif", padding: "36px 24px 60px" }}>
      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16, marginBottom: 6 }}>
          <div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#F5A623", letterSpacing: 2, marginBottom: 6 }}>
              PROYECTO DE MANTENIMIENTO
            </div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 34, color: "#E8E6E1", margin: 0, fontWeight: 700 }}>
              Inventario de equipos
            </h1>
          </div>
          <button onClick={() => setModal({ ...emptyForm })} style={{ display: "flex", alignItems: "center", gap: 8,
            background: "#F5A623", border: "none", color: "#151A24", fontWeight: 700, fontSize: 13.5,
            padding: "11px 18px", borderRadius: 7, cursor: "pointer" }}>
            <IconPlus size={16} /> Agregar equipo
          </button>
        </div>

        <div style={{ display: "flex", gap: 18, marginTop: 22, marginBottom: 26, flexWrap: "wrap" }}>
          {Object.entries(STATUS).map(([k, v]) => (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#8B93A7" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: v.color, display: "inline-block" }} />
              {counts[k]} {v.label.toLowerCase()}
            </div>
          ))}
          <div style={{ fontSize: 13, color: "#5B6478" }}>· {equipos.length} equipos en total</div>
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 26, flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: "1 1 260px" }}>
            <IconSearch size={15} style={{ position: "absolute", left: 12, top: 11, color: "#5B6478" }} />
            <input value={query} onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar por código, ubicación, modelo o procesador..."
              style={{ ...inputStyle, paddingLeft: 36 }} />
          </div>
          <div style={{ position: "relative", width: 190 }}>
            <select value={filtro} onChange={(e) => setFiltro(e.target.value)} style={selectStyle}>
              <option value="todos">Todos los estados</option>
              <option value="operativo">Operativo</option>
              <option value="reparacion">En reparación</option>
              <option value="baja">De baja</option>
            </select>
            <IconChevronDown size={14} style={{ position: "absolute", right: 10, top: 11, color: "#8B93A7", pointerEvents: "none" }} />
          </div>
        </div>

        {filtered.length === 0 ? (
          <div style={{ border: "1px dashed #2A3242", borderRadius: 10, padding: "50px 20px", textAlign: "center", color: "#5B6478", fontSize: 14 }}>
            {equipos.length === 0
              ? 'Aún no has agregado equipos. Usa "Agregar equipo" para empezar tu inventario.'
              : "Ningún equipo coincide con la búsqueda o el filtro."}
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 16 }}>
            {filtered.map((pc) => (
              <AssetTag key={pc.id} pc={pc} onEdit={(p) => setModal(p)} onDelete={handleDelete} />
            ))}
          </div>
        )}
      </div>

      {modal && <Modal initial={modal} onClose={() => setModal(null)} onSave={handleSave} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Inventario />);
</script>
</body>
</html>
